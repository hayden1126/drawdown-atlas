[project]
name = "sp500-drawdowns"
version = "0.1.0"
description = "Find SPX peak-to-trough drawdowns >=10% and rank constituents that did best in each"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "click>=8.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
